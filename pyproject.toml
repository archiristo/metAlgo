[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MetAlgo"
version = "1.0.0"
description = "Meta-heuristic optimization framework"
authors = [
    { name = "archiristo", email = "iriskc27@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "opencv-python>=4.6.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]